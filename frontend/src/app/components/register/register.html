<div class="container mt-5">
  <h2>Register</h2>

  <form (ngSubmit)="register()">

    <input
      type="text"
      class="form-control mb-3"
      placeholder="Username"
      [(ngModel)]="user.name"
      name="name"
    >

    <input
      type="email"
      class="form-control mb-3"
      placeholder="Email"
      [(ngModel)]="user.email"
      name="email"
    >

    <input
      type="password"
      class="form-control mb-3"
      placeholder="Password"
      [(ngModel)]="user.password"
      name="password"
    >

    <button class="btn btn-primary">
      Register
    </button>

  </form>
</div>
